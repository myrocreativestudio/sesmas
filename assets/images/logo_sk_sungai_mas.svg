<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b1d" />
      <stop offset="50%" stop-color="#054427" />
      <stop offset="100%" stop-color="#022113" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="riverGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Glow & Shield Base -->
  <g filter="url(#softShadow)">
    <!-- Golden Outer Trim -->
    <path d="M 200,25 C 290,25 355,50 355,140 C 355,255 260,335 200,365 C 140,335 45,255 45,140 C 45,50 110,25 200,25 Z" 
          fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />

    <!-- Inner Shield (Emerald/Forest) -->
    <path d="M 200,37 C 282,37 341,60 341,142 C 341,247 254,321 200,349 C 146,321 59,247 59,142 C 59,60 118,37 200,37 Z" 
          fill="url(#shieldGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

    <!-- Pahang White & Black Identity Crest Accent -->
    <g transform="translate(200, 70)">
      <path d="M -90,0 L 0,-20 L 90,0 L 75,30 L -75,30 Z" fill="#ffffff" />
      <path d="M -75,30 L 75,30 L 0,46 Z" fill="#0b0f19" />
      <circle cx="0" cy="5" r="14" fill="url(#goldGrad)" />
      <!-- Small Star & Crescent or Royal motif -->
      <path d="M -3,-2 L 0,-10 L 3,-2 L 9,-2 L 4,3 L 6,10 L 0,6 L -6,10 L -4,3 L -9,-2 Z" fill="#ffffff" transform="scale(0.8)" />
    </g>

    <!-- Golden Rays of Rising Sun (Pendidikan Masa Depan) -->
    <g opacity="0.35">
      <line x1="200" y1="180" x2="130" y2="120" stroke="url(#riverGold)" stroke-width="3" />
      <line x1="200" y1="180" x2="155" y2="105" stroke="url(#riverGold)" stroke-width="3" />
      <line x1="200" y1="180" x2="200" y2="95" stroke="url(#riverGold)" stroke-width="3" />
      <line x1="200" y1="180" x2="245" y2="105" stroke="url(#riverGold)" stroke-width="3" />
      <line x1="200" y1="180" x2="270" y2="120" stroke="url(#riverGold)" stroke-width="3" />
    </g>

    <!-- Mountain Silhouette (Gunung & Alam Semula Jadi Kuantan) -->
    <path d="M 80,215 Q 140,140 200,185 Q 260,135 320,215 L 320,220 L 80,220 Z" fill="#063821" opacity="0.9" />

    <!-- Golden River (Sungai Mas) Curves -->
    <path d="M 90,215 C 150,195 180,250 200,240 C 230,225 260,250 310,215 C 280,270 230,270 200,255 C 170,270 120,265 90,215 Z" 
          fill="url(#riverGold)" opacity="0.95" filter="url(#goldGlow)" />
    
    <!-- Open Book Symbol (Pendidikan & Ilmu) -->
    <g transform="translate(200, 195)">
      <!-- Left Page -->
      <path d="M -2,15 C -25,2 -55,6 -65,18 C -65,18 -64,-25 -64,-25 C -54,-35 -25,-38 -2,-26 Z" 
            fill="url(#whiteGrad)" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Right Page -->
      <path d="M 2,15 C 25,2 55,6 65,18 C 65,18 64,-25 64,-25 C 54,-35 25,-38 2,-26 Z" 
            fill="url(#whiteGrad)" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Spine & Flame/Torch of Knowledge -->
      <path d="M 0,-25 L 0,16" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
      
      <!-- Golden Flame above Book -->
      <path d="M 0,-30 C -8,-45 0,-55 0,-62 C 0,-55 8,-45 0,-30 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
      <path d="M 0,-35 C -4,-44 0,-50 0,-54 C 0,-50 4,-44 0,-35 Z" fill="#ffffff" />
    </g>

    <!-- Indigenous Heritage Weave / Motif Border (Bunga Anyaman Tradisi) -->
    <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M 90,130 L 105,145 L 90,160 L 75,145 Z" fill="#047857" />
      <path d="M 310,130 L 325,145 L 310,160 L 295,145 Z" fill="#047857" />
    </g>

    <!-- Motto Banner Ribbon -->
    <g transform="translate(200, 315)">
      <!-- Ribbon Backing -->
      <path d="M -160,18 L -140,-5 L -115,10 Z" fill="#92400e" />
      <path d="M 160,18 L 140,-5 L 115,10 Z" fill="#92400e" />
      
      <!-- Ribbon Tails -->
      <path d="M -165,18 L -130,-12 L -120,12 L -140,24 Z" fill="#d97706" />
      <path d="M 165,18 L 130,-12 L 120,12 L 140,24 Z" fill="#d97706" />

      <!-- Main Banner Plate -->
      <path d="M -145,-12 L 145,-12 C 155,-12 160,0 155,14 L 145,20 C 135,26 -135,26 -145,20 L -155,14 C -160,0 -155,-12 -145,-12 Z" 
            fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" filter="url(#softShadow)" />

      <!-- Motto Text -->
      <text x="0" y="8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="900" 
            fill="#3f1a00" text-anchor="middle" letter-spacing="1.2">BERILMU • BERBUDAYA • BERBAKTI</text>
    </g>

    <!-- School Name Banner Top Arch -->
    <g transform="translate(200, 275)">
      <rect x="-135" y="-12" width="270" height="26" rx="13" fill="#0a1a12" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12.5" font-weight="800" 
            fill="#fef08a" text-anchor="middle" letter-spacing="1">SK SUNGAI MAS (JHEOA)</text>
    </g>

    <!-- Location Text Bottom -->
    <text x="200" y="344" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" 
          fill="#cbd5e1" text-anchor="middle" letter-spacing="2">KUANTAN, PAHANG</text>
  </g>
</svg>
